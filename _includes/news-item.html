{% assign icon_path = "/assets/img/news-icons/" | append: item.type | append: ".svg" %}

<li class="home-news-item{% if item.highlight %} home-news-item-highlight{% endif %}">
  <span class="home-news-date">{{ item.date | date: "%b-%d-%Y" }}</span>
  <span class="home-news-sep" aria-hidden="true"></span>
  <span class="home-news-text">
    {% if item.link %}
      <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">
        <img src="{{ icon_path | relative_url }}" class="home-news-icon-img" alt="">
        {{ item.text }}
      </a>
    {% else %}
      <img src="{{ icon_path | relative_url }}" class="home-news-icon-img" alt="">
      {{ item.text }}
    {% endif %}
  </span>
</li>
